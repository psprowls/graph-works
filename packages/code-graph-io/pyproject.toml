[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-graph-io"
version = "0.1.0"
description = "Code-graph core for the agent-workspace ecosystem — SQLite store, manifest scanning, and read-only queries."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
# 3.12 is the workspace floor (see the root pyproject's note). Declaring 3.11
# here advertised support the workspace as a whole never had.
requires-python = ">=3.12"
dependencies = [
  "tree-sitter>=0.23.0",
  "tree-sitter-language-pack>=0.8.0,<=1.6.2",
  "pyyaml>=6.0",
  "tiktoken>=0.7",
]


[tool.hatch.build.targets.wheel]
packages = ["src/code_graph_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the agent-research workspace graph (skipped when unavailable)",
]
