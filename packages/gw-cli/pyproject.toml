[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gw-cli"
version = "0.5.0"
description = "gw: the graph-works CLI — a thin Typer interface over gw-kernel (ADR 2026-08-13-command-modules)."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gw-pipeline>=0.2,<0.3",
  "gw-work>=0.2,<0.3",
  "gw-orchestrate>=0.2,<0.3",
  "gw-kernel>=0.7,<0.8",
  "gw-wiki>=0.1,<0.2",
  "gw-wire>=0.3,<0.4",
  "models-io>=0.2,<0.3",
  "code-graph-io>=0.3.2,<0.4",
  "config-io>=0.2,<0.3",
  "code-wiki-okf>=0.5.4,<0.6",
  "doc-wiki-okf>=0.3.2,<0.4",
  "okf-ext[schemas]>=0.5.2,<0.6",
  "okf-io>=0.2.5,<0.3",
  "subagents-io>=0.3,<0.4",
  "workflow-orca>=0.3,<0.4",
  "typer>=0.27",
  "click>=8.0",
]

[project.scripts]
gw = "gw_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gw_cli"]

[tool.uv.sources]
gw-pipeline = { workspace = true }
gw-work = { workspace = true }
gw-orchestrate = { workspace = true }
gw-kernel = { workspace = true }
gw-wiki = { workspace = true }
gw-wire = { workspace = true }
models-io = { workspace = true }
code-graph-io = { workspace = true }
config-io = { workspace = true }
code-wiki-okf = { workspace = true }
doc-wiki-okf = { workspace = true }
okf-ext = { workspace = true }
okf-io = { workspace = true }
subagents-io = { workspace = true }
workflow-orca = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
