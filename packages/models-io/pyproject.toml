[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "models-io"
version = "0.1.1"
description = "Guarded Bedrock and Vercel AI Gateway chat-model constructors: an access-denied taxonomy, content normalization, and caller-supplied credentials."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
# Zero runtime dependencies. `BaseChatModel` appears only as a return
# annotation, so `loader.py` imports it under TYPE_CHECKING; `errors.py` and
# `normalize.py` are pure stdlib. Every provider distribution lives in an
# extra, which is what keeps the two stacks isolated from each other as well
# as from the rest of the workspace.
dependencies = []

[project.optional-dependencies]
bedrock = ["langchain-aws>=1.4.6", "boto3>=1.38"]
vercel = ["langchain-openai>=1.3.3,<2", "openai>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/models_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Nothing else in this workspace has async tests, so the root config does not
# set this. Three `async def test_*` live here (two in test_bedrock.py, one in
# test_vercel.py) and pytest resolves rootdir to THIS file under the
# `--package models-io` invocation, so the setting has to be repeated here.
asyncio_mode = "auto"
