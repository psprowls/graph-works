[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okf-ext"
version = "0.1.0"
description = "Beyond-spec capabilities over any OKF v0.2 bundle. Tier 2: extends okf-io, never modifies it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Tier 2 depends on the core, never the other way round (ADR-0005).
    # Pre-1.0 policy is minor = breaking (ADR-0007), so the ceiling is 0.2.
    "okf-io>=0.1,<0.2",
    # Read `_tags.yaml`. Declared rather than inherited through okf-io: an
    # undeclared transitive import breaks the day the core swaps YAML libraries,
    # and reaching into `okf_io._yaml` would couple this package to a private
    # module of the one it sits above.
    "ruamel.yaml>=0.18",
    # Parse markdown bodies in the `render` capability. Declared for the same
    # reason `ruamel.yaml` is, and floored where okf-io floors it.
    #
    # Unconditional rather than an extra, despite only one capability using it:
    # okf-io hard-depends on `markdown-it-py`, so the `ImportError` guard the
    # README's extras policy requires could never fire. An extra whose guard is
    # unfalsifiable is not a boundary, and the unreachable branch would cost
    # coverage against a 95% floor with a thin margin.
    "markdown-it-py>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okf_ext"]

[project.optional-dependencies]
# The `schemas` capability, and only it, needs a JSONSchema engine. `>=4.18` is
# where `referencing` landed, which is what resolves `$ref` across files.
# `okf_ext/schemas/__init__.py` raises an ImportError naming this extra when it
# is missing, per the README's dependency policy.
schemas = ["jsonschema>=4.18"]
