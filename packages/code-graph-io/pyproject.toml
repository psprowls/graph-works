[project]
name = "code-graph-io"
version = "0.2.1"
description = "Code-graph core for the agent-workspace ecosystem — SQLite store, manifest scanning, and read-only queries."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "code-parser",
  "pyyaml>=6.0",
  "tiktoken>=0.7",
]


[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
code-parser = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the agent-research workspace graph (skipped when unavailable)",
]
