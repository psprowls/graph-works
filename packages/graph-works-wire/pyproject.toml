[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-works-wire"
version = "0.1.2"
description = "Typed graph-works results projected to plain JSON data, shared by every interface (CLI, serve)."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "graph-works-core>=0.6.2,<0.7",
  "config-io>=0.2,<0.3",
  "doc-wiki-okf>=0.3.2,<0.4",
  "okf-ext>=0.4.12,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_works_wire"]

[tool.uv.sources]
graph-works-core = { workspace = true }
config-io = { workspace = true }
doc-wiki-okf = { workspace = true }
okf-ext = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
