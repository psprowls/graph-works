[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-parser"
version = "0.1.1"
description = "Tree-sitter-backed Python package that turns source files into a span-bearing SourceTree, with a graph projection aligned to code-graph-io."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
# 3.12 is the workspace floor (see the root pyproject's note). Declaring 3.11
# here advertised support the workspace as a whole never had.
requires-python = ">=3.12"
dependencies = [
  "tree-sitter>=0.23.0",
  "tree-sitter-language-pack>=0.8.0,<=1.6.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
