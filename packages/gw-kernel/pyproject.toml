[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gw-kernel"
version = "0.7.0"
description = "What a workspace is: discovery, the layout object, the manifest, and init."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
# Workspace init installs the OKF lanes; graph and read_session use their APIs.
# `subagents-io` remains for workspace.dispatch's backend seam.
# `markdown-it-py` supplies commonmark parsing in workspace.citations.
# `ruamel.yaml` supplies authored manifest edits and declaration parsing.
dependencies = [
  "okf-io>=0.2.6,<0.3",
  "okf-ext[schemas]>=0.5.5,<0.6",
  "code-wiki-okf>=0.5.4,<0.6",
  "doc-wiki-okf>=0.3.2,<0.4",
  "repositories-okf>=0.1.3,<0.2",
  "code-graph-io>=0.3.2,<0.4",
  "work-tracker-okf>=0.6.0,<0.7",
  "config-io>=0.2,<0.3",
  "subagents-io>=0.2,<0.3",
  "ruamel.yaml>=0.18",
  "markdown-it-py>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gw_kernel"]

[tool.hatch.build.targets.sdist.force-include]
"../../plugins/gw/hooks/examples" = "src/gw_kernel/_hook_scripts"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
okf-io = { workspace = true }
okf-ext = { workspace = true }
code-wiki-okf = { workspace = true }
doc-wiki-okf = { workspace = true }
repositories-okf = { workspace = true }
code-graph-io = { workspace = true }
work-tracker-okf = { workspace = true }
config-io = { workspace = true }
subagents-io = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
