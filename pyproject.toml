[project]
name = "agent-workspace"
version = "0.0.0"
description = "uv workspace root for the okf-io packages. Not distributable."
# 3.12 is the floor for the whole workspace. `okf_io.models.Frontmatter.extra`
# defaults to `MappingProxyType({})`, which the dataclass machinery rejects as a
# mutable default until `mappingproxy` became hashable in 3.12. On 3.11 both
# packages install and then fail at import, so 3.11 was never really supported.
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
okf-io = { workspace = true }
okf-ext = { workspace = true }
config-io = { workspace = true }
models-io = { workspace = true }
subagents-io = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.0",
    # Not a dependency of `subagents-io` — its `[project] dependencies` is
    # empty and stays that way. One test in that package's suite passes
    # `price_lookup=cost_for_usage` as the contract test for the injection
    # seam, and that import has to resolve under `uv run --package
    # subagents-io pytest`.
    "models-io",
    "mypy>=1.11",
    "okf-ext[schemas]",
    "okf-io",
    "pytest>=8.0",
    # models-io and subagents-io are the packages with `async def test_*`.
    # Each sets asyncio_mode = "auto" in its own [tool.pytest.ini_options];
    # this is what makes that option resolvable.
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Neither `jsonschema` nor `pyyaml` ships a `py.typed`, so `just types`
    # fails without stubs. Dev tooling only — not runtime dependencies.
    "types-jsonschema",
    "types-PyYAML",
]

[tool.ruff]
line-length = 120
exclude = ["**/fixtures/**", ".claude/skills/**", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]

[tool.ruff.lint.per-file-ignores]
"packages/okf-io/tests/**" = ["ANN"]
"packages/okf-ext/tests/**" = ["ANN"]
"packages/code-graph-io/tests/**" = ["ANN"]
"packages/code-wiki-okf/tests/**" = ["ANN"]
"packages/work-tracker-okf/tests/**" = ["ANN"]
"packages/config-io/tests/**" = ["ANN"]
"packages/models-io/tests/**" = ["ANN"]
"packages/subagents-io/tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true

# botocore ships no py.typed and botocore-stubs is a large dev dependency for
# one `except` clause and one `.response` read. models-io subclasses nothing
# from botocore, so `disallow_subclassing_any` is not in play here.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/okf-io/tests", "packages/okf-ext/tests"]
# Both test directories sit flat on this path with no `__init__.py` in either,
# so a duplicate `test_*.py` basename fails loudly at collection ("import file
# mismatch") — but a duplicate *plain* module basename (the `helpers.py` /
# `ext_helpers.py` class of name) collides silently: whichever is imported
# first wins, and the other suite quietly binds to the wrong module. Any new
# plain helper module needs a name unique across both directories, not just
# within its own.
pythonpath = ["packages/okf-io/tests", "packages/okf-ext/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["okf_io", "okf_ext"]

# The tier-2 internal boundary (okf-ext README, "Boundaries"). The shared
# layer never imports a capability; capabilities may import the shared layer.
#
# The companion rule — a capability never importing the top-level `okf_ext`
# package — is NOT here, because import-linter cannot express it: grimp does
# not report an import of an ancestor package as a dependency, so a `forbidden`
# contract naming `okf_ext` reports KEPT even when the import exists. That half
# is `packages/okf-ext/tests/test_ext_boundaries.py`.
#
# The independence contract between sibling capabilities is stated explicitly
# rather than left to the `a : b` layer syntax's same-level semantics: the rule
# the README promises should be legible in the file, not inferred from a colon.
[tool.importlinter]
root_packages = ["okf_io", "okf_ext", "code_graph_io", "config_io", "models_io", "subagents_io"]

[[tool.importlinter.contracts]]
name = "Capabilities sit above the shared context, never below it"
type = "layers"
# The capabilities line is appended to, alphabetically, on every new
# capability; ten names and 174 characters as of `proposals`, and it is
# expected to keep growing one name at a time with no wrap strategy. Long is
# fine -- `test_every_capability_is_named_in_the_layers_contract` is what
# actually keeps it honest, not its width.
layers = [
    "okf_ext.bundle : okf_ext.generators : okf_ext.health : okf_ext.moves : okf_ext.placement : okf_ext.proposals : okf_ext.render : okf_ext.schemas : okf_ext.search : okf_ext.sections : okf_ext.tags : okf_ext.tables",
    "okf_ext.shape",
    "okf_ext.splice : okf_ext.writing",
    "okf_ext.body",
    "okf_ext.context",
]

[[tool.importlinter.contracts]]
name = "Capabilities never import each other"
type = "independence"
modules = [
    "okf_ext.tags",
    "okf_ext.schemas",
    "okf_ext.render",
    "okf_ext.health",
    "okf_ext.search",
    "okf_ext.tables",
    "okf_ext.moves",
    "okf_ext.sections",
    "okf_ext.generators",
    "okf_ext.proposals",
    "okf_ext.bundle",
    "okf_ext.placement",
]

# Parsing sits below the rest of code-graph-io: a single `:`-joined top layer
# because the package has intra-layer cycles (repo_context <-> update,
# deferred inside functions; structural_nodes -> update), so the contract
# states the one direction that matters (nothing may import parser back) and
# stays silent about the rest. `exhaustive = true` means a module added later
# fails the contract until classified.
[[tool.importlinter.contracts]]
name = "Parsing sits below the graph"
type = "layers"
containers = ["code_graph_io"]
exhaustive = true
layers = [
    "_ignore : agent_plugins : builtins : classification : entry_points : exit_codes : graphml : handle : import_scan : packages : paths : queries : records : render : repo_context : resolve : schema : source_meta : store : structural_nodes : test_suites : testing : tokens : update : upsert : uri",
    "parser",
]

# The band-1 rule, stated categorically rather than by enumerating permitted
# edges: no foundation package imports any other. `independence` and not
# `layers` — a `layers` contract needs a total order among the packages it
# names, and there is no order to state here; the rule is that every direction
# is forbidden. An earlier docstring in `subagents-io` concluded grimp could
# not express this at all. It can; the contract type was wrong.
#
# `okf_ext` is a root package above but is deliberately absent from `modules`:
# it is band 2 and depends on `okf-io` by design.
#
# This does not replace each package's `tests/test_boundaries.py`. The two fail
# in different directions: the AST walks derive their sibling set from the
# filesystem, so a package added later is covered with no edit, but each only
# sees imports out of the package it lives in; this contract is workspace-level
# and catches an edge introduced from the other side, but `modules` is
# enumerated and a new band-1 package has to be added to it by hand.
[[tool.importlinter.contracts]]
name = "The foundation is a strict layer — band-1 packages never import each other"
type = "independence"
modules = ["okf_io", "code_graph_io", "config_io", "models_io", "subagents_io"]
