[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-works-cli"
version = "0.3.1"
description = "gw: the graph-works CLI — a thin Typer interface over graph-works-core (ADR-0013)."
authors = [
  { name = "Patrick Sprowls", email = "psprowls@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "graph-works-core>=0.5.0,<0.6",
  "models-io>=0.2,<0.3",
  "code-graph-io>=0.3,<0.4",
  "config-io>=0.1,<0.2",
  "code-wiki-okf>=0.5,<0.6",
  "doc-wiki-okf>=0.3.2,<0.4",
  "okf-ext[schemas]>=0.4.11,<0.5",
  "okf-io>=0.2.4,<0.3",
  "subagents-io>=0.2.1,<0.3",
  "typer>=0.12",
  "click>=8.0",
]

[project.scripts]
gw = "graph_works_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_works_cli"]

[tool.uv.sources]
graph-works-core = { workspace = true }
models-io = { workspace = true }
code-graph-io = { workspace = true }
config-io = { workspace = true }
code-wiki-okf = { workspace = true }
doc-wiki-okf = { workspace = true }
okf-ext = { workspace = true }
okf-io = { workspace = true }
subagents-io = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
