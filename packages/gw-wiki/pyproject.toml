[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gw-wiki"
version = "0.1.0"
description = "Wiki scan, ingest, query, proposals and repository operations over kernel primitives."
readme = "README.md"
requires-python = ">=3.12"
# `gw-kernel` supplies resolved workspace, graph and read-session primitives.
# Only what this package composes today. Each entry has its consumer in the
# change that added it -- C1's bar, kept.
#
# `code-graph-io` arrived with C7, the graph surface in `commands/graph.py`;
# read again by C4's entity matcher via the same `GraphReader`, and by C6's
# drift propagator, which resolves an entity's `resource` to a repo-relative
# node path through it. `doc-wiki-okf` arrived with C4: the ingest vertical
# calls `ingest.plan_document_brief`, `sources.plan_ingest`,
# `proposals.plan_file` and `diataxis.classify`; C6 reads it again for
# `proposals.adr.is_adr`, the ADR group's selector, with the directory read
# from the workspace's `Adr` schema. `code-wiki-okf` was already
# here for C1 and now also supplies `git_state.compute_state_gate` and the
# `entities.pages` naming rule. The other three arrived for C2: `langchain-core`
# because `agent_loop` constructs `ToolMessage` and takes `BaseTool` for real,
# `subagents-io` for `RoleSpec`/`RoleBinding`/`resolve_role_spec`, and
# `models-io[bedrock]` because Bedrock is the only backend the packaged
# catalog names.
# `plugin-fork-io` arrived with agent-config reads: `agent_config.conventions`
# reads `adapters.adapter(name).config`, the single where-agents-keep-things table.
# `repositories-okf` arrived with the repositories lane: `workspace.init` installs it and `workspace.bundle` appends its `CLONE_GLOB` to every bundle load.
dependencies = [
  "gw-kernel>=0.7,<0.8",
  "okf-io>=0.2.6,<0.3",
  "okf-ext[schemas]>=0.5.5,<0.6",
  "doc-wiki-okf>=0.3.2,<0.4",
  "code-wiki-okf>=0.5.4,<0.6",
  "repositories-okf>=0.1.3,<0.2",
  "code-graph-io>=0.3.2,<0.4",
  "work-tracker-okf>=0.6.0,<0.7",
  "config-io>=0.2,<0.3",
  "langchain-core>=1.4",
  "subagents-io>=0.2,<0.3",
  "models-io[bedrock]>=0.2,<0.3",
  "plugin-fork-io>=0.1.1,<0.2",
]

# The gateway backend is reachable by declaration rather than by a documented
# `pip install` incantation. Without it a `backend = "vercel"` override raises
# models-io's own `ProviderNotInstalled`, which is the correct failure.
[project.optional-dependencies]
vercel = ["models-io[vercel]"]

[dependency-groups]
# Cross-work lint integration is development-only; no runtime slice edge.
dev = ["gw-work"]

[tool.hatch.build.targets.wheel]
packages = ["src/gw_wiki"]

[tool.uv.sources]
gw-kernel = { workspace = true }
okf-io = { workspace = true }
okf-ext = { workspace = true }
doc-wiki-okf = { workspace = true }
code-wiki-okf = { workspace = true }
repositories-okf = { workspace = true }
code-graph-io = { workspace = true }
work-tracker-okf = { workspace = true }
config-io = { workspace = true }
subagents-io = { workspace = true }
models-io = { workspace = true }
plugin-fork-io = { workspace = true }
gw-work = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Agent-loop tests are async; package rootdir does not inherit root settings.
asyncio_mode = "auto"
