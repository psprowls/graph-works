[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gw-pipeline"
version = "0.1.0"
description = "Pipeline engine and services over resolved kernel workspace primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gw-kernel>=0.7,<0.8",
  "work-tracker-okf>=0.6.0,<0.7",
  "okf-io>=0.2.6,<0.3",
  "okf-ext[schemas]>=0.5.5,<0.6",
  "code-graph-io>=0.3.2,<0.4",
  "config-io>=0.2,<0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gw_pipeline"]

[tool.uv.sources]
gw-kernel = { workspace = true }
work-tracker-okf = { workspace = true }
okf-io = { workspace = true }
okf-ext = { workspace = true }
code-graph-io = { workspace = true }
config-io = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
