[project]
name = "agent-workspace"
version = "0.0.0"
description = "uv workspace root for the okf-io packages. Not distributable."
# 3.12 is the floor for the whole workspace. `okf_io.models.Frontmatter.extra`
# defaults to `MappingProxyType({})`, which the dataclass machinery rejects as a
# mutable default until `mappingproxy` became hashable in 3.12. On 3.11 both
# packages install and then fail at import, so 3.11 was never really supported.
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
okf-io = { workspace = true }
okf-ext = { workspace = true }
config-io = { workspace = true }
models-io = { workspace = true }
subagents-io = { workspace = true }
code-graph-io = { workspace = true }
code-wiki-okf = { workspace = true }
work-tracker-okf = { workspace = true }
doc-wiki-okf = { workspace = true }
graph-works-core = { workspace = true }
workflow-local = { workspace = true }
workflow-orca = { workspace = true }
graph-works-cli = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.0",
    # Not a dependency of `subagents-io` — its `[project] dependencies` is
    # empty and stays that way. One test in that package's suite passes
    # `price_lookup=cost_for_usage` as the contract test for the injection
    # seam, and that import has to resolve under `uv run --package
    # subagents-io pytest`.
    "models-io",
    "mypy>=1.11",
    "okf-ext[schemas]",
    "okf-io",
    "pytest>=8.0",
    # models-io and subagents-io are the packages with `async def test_*`.
    # Each sets asyncio_mode = "auto" in its own [tool.pytest.ini_options];
    # this is what makes that option resolvable.
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # Neither `jsonschema` nor `pyyaml` ships a `py.typed`, so `just types`
    # fails without stubs. Dev tooling only — not runtime dependencies.
    "types-jsonschema",
    "types-PyYAML",
    "doc-wiki-okf",
    "graph-works-core",
    "workflow-local",
    "workflow-orca",
]

[tool.ruff]
line-length = 120
exclude = ["**/fixtures/**", ".claude/skills/**", "scripts", "plugins"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]

[tool.ruff.lint.per-file-ignores]
"packages/okf-io/tests/**" = ["ANN"]
"packages/okf-ext/tests/**" = ["ANN"]
"packages/code-graph-io/tests/**" = ["ANN"]
"packages/code-wiki-okf/tests/**" = ["ANN"]
"packages/work-tracker-okf/tests/**" = ["ANN"]
"packages/config-io/tests/**" = ["ANN"]
"packages/models-io/tests/**" = ["ANN"]
"packages/subagents-io/tests/**" = ["ANN"]
"packages/doc-wiki-okf/tests/**" = ["ANN"]
"packages/graph-works-core/tests/**" = ["ANN"]
"packages/workflow-local/tests/**" = ["ANN"]
"packages/workflow-orca/tests/**" = ["ANN"]
"packages/graph-works-cli/tests/**" = ["ANN"]
"packages/graph-works-core/src/graph_works_core/prompts/_fragments/*.py" = ["E501"]
"packages/graph-works-core/src/graph_works_core/query/prompts/code_reader.py" = ["E501"]
"packages/graph-works-core/src/graph_works_core/query/prompts/synthesizer.py" = ["E501"]
"packages/graph-works-core/src/graph_works_core/query/prompts/query_orchestrator.py" = ["E501"]
"packages/graph-works-core/src/graph_works_core/query/prompts/librarian.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

# botocore ships no py.typed and botocore-stubs is a large dev dependency for
# one `except` clause and one `.response` read. models-io subclasses nothing
# from botocore, so `disallow_subclassing_any` is not in play here.
[[tool.mypy.overrides]]
module = ["botocore.*"]
ignore_missing_imports = true

# bm25s ships no py.typed marker or stub package. graph-works-core's index
# build/query is a thin wrapper over its documented API.
[[tool.mypy.overrides]]
module = ["bm25s.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/okf-io/tests", "packages/okf-ext/tests", "scripts/tests"]
# Both test directories sit flat on this path with no `__init__.py` in either,
# so a duplicate `test_*.py` basename fails loudly at collection ("import file
# mismatch") — but a duplicate *plain* module basename (the `helpers.py` /
# `ext_helpers.py` class of name) collides silently: whichever is imported
# first wins, and the other suite quietly binds to the wrong module. Any new
# plain helper module needs a name unique across both directories, not just
# within its own.
pythonpath = ["packages/okf-io/tests", "packages/okf-ext/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["okf_io", "okf_ext"]

# The tier-2 internal boundary (okf-ext README, "Boundaries"). The shared
# layer never imports a capability; capabilities may import the shared layer.
#
# The companion rule — a capability never importing the top-level `okf_ext`
# package — is NOT here, because import-linter cannot express it: grimp does
# not report an import of an ancestor package as a dependency, so a `forbidden`
# contract naming `okf_ext` reports KEPT even when the import exists. That half
# is `packages/okf-ext/tests/test_ext_boundaries.py`.
#
# The independence contract between sibling capabilities is stated explicitly
# rather than left to the `a : b` layer syntax's same-level semantics: the rule
# the README promises should be legible in the file, not inferred from a colon.
[tool.importlinter]
root_packages = [
    "okf_io", "okf_ext", "code_graph_io", "config_io", "models_io", "subagents_io",
    "code_wiki_okf", "work_tracker_okf", "doc_wiki_okf", "graph_works_core",
    "workflow_local", "workflow_orca",
]

[[tool.importlinter.contracts]]
name = "Capabilities sit above the shared context, never below it"
type = "layers"
# The capabilities line is appended to, alphabetically, on every new
# capability; ten names and 174 characters as of `proposals`, and it is
# expected to keep growing one name at a time with no wrap strategy. Long is
# fine -- `test_every_capability_is_named_in_the_layers_contract` is what
# actually keeps it honest, not its width.
layers = [
    "okf_ext.bundle : okf_ext.generators : okf_ext.health : okf_ext.logs : okf_ext.moves : okf_ext.placement : okf_ext.proposals : okf_ext.render : okf_ext.schemas : okf_ext.search : okf_ext.sections : okf_ext.tags : okf_ext.tables",
    "okf_ext.shape",
    "okf_ext.splice : okf_ext.writing",
    "okf_ext.body",
    "okf_ext.context",
]

[[tool.importlinter.contracts]]
name = "Capabilities never import each other"
type = "independence"
modules = [
    "okf_ext.tags",
    "okf_ext.schemas",
    "okf_ext.render",
    "okf_ext.health",
    "okf_ext.search",
    "okf_ext.tables",
    "okf_ext.moves",
    "okf_ext.sections",
    "okf_ext.generators",
    "okf_ext.proposals",
    "okf_ext.bundle",
    "okf_ext.placement",
    "okf_ext.logs",
]

# Parsing sits below the rest of code-graph-io: a single `:`-joined top layer
# because the package has intra-layer cycles (repo_context <-> update,
# deferred inside functions; structural_nodes -> update), so the contract
# states the one direction that matters (nothing may import parser back) and
# stays silent about the rest. `exhaustive = true` means a module added later
# fails the contract until classified.
[[tool.importlinter.contracts]]
name = "Parsing sits below the graph"
type = "layers"
containers = ["code_graph_io"]
exhaustive = true
layers = [
    "_ignore : agent_plugins : builtins : classification : csharp_projects : dependencies : entry_points : exit_codes : graphml : handle : import_scan : packages : paths : queries : records : render : repo_context : resolve : schema : source_meta : store : structural_nodes : test_suites : testing : tokens : update : upsert : uri",
    "parser",
]

# The band-1 rule, stated categorically rather than by enumerating permitted
# edges: no foundation package imports any other. `independence` and not
# `layers` — a `layers` contract needs a total order among the packages it
# names, and there is no order to state here; the rule is that every direction
# is forbidden. An earlier docstring in `subagents-io` concluded grimp could
# not express this at all. It can; the contract type was wrong.
#
# `okf_ext` is a root package above but is deliberately absent from `modules`:
# it is band 2 and depends on `okf-io` by design.
#
# `workflow_local` and `workflow_orca` are likewise absent, for the same
# reason: neither is band 1 and both depend on `subagents_io` by design. The
# direction that WOULD be a defect is the reverse one, and no existing contract
# covers it — hence the `forbidden` contract below.
#
# This does not replace each package's `tests/test_boundaries.py`. The two fail
# in different directions: the AST walks derive their sibling set from the
# filesystem, so a package added later is covered with no edit, but each only
# sees imports out of the package it lives in; this contract is workspace-level
# and catches an edge introduced from the other side, but `modules` is
# enumerated and a new band-1 package has to be added to it by hand.
[[tool.importlinter.contracts]]
name = "The foundation is a strict layer — band-1 packages never import each other"
type = "independence"
modules = ["okf_io", "code_graph_io", "config_io", "models_io", "subagents_io"]

# Constraint 1 is the reason this epic exists: exactly one package knows what a
# workspace is, and every package below band 3 receives resolved paths as
# arguments. Stating it here makes a violation a `just check` failure rather
# than a code-review observation.
[[tool.importlinter.contracts]]
name = "Nothing below band 3 imports the application band"
type = "forbidden"
source_modules = [
    "okf_io", "okf_ext", "code_wiki_okf", "work_tracker_okf", "doc_wiki_okf",
    "config_io", "subagents_io", "models_io", "code_graph_io",
]
forbidden_modules = ["graph_works_core"]

# The seam only works in one direction. `independence` forbids every edge AMONG
# the band-1 packages; this forbids the one edge OUT of band 1 that would undo
# the reason `workflow-local` (and now `workflow-orca`) are separate packages
# at all — a protocol that imports its own implementation is a protocol with an
# implementation in it. Both backends are named in one contract rather than one
# contract each: the rule is about `subagents_io`, and it does not get a new
# clause every time a backend ships.
[[tool.importlinter.contracts]]
name = "The dispatch protocol never imports a backend"
type = "forbidden"
source_modules = ["subagents_io"]
forbidden_modules = ["workflow_local", "workflow_orca"]

# Two backends importing each other is the defect no existing contract covers:
# neither is band 1, so the foundation contract does not see them, and neither
# sits above the other, so there is no layer to state.
#
# `workflow_orca` is likewise absent from the band-1 independence contract
# above, for the same reason recorded there about `okf_ext` and
# `workflow_local`: it is not band 1 and it depends on `subagents_io` by
# design.
[[tool.importlinter.contracts]]
name = "Backends never import each other"
type = "independence"
modules = ["workflow_local", "workflow_orca"]

[[tool.importlinter.contracts]]
name = "graph_works_core verticals sit above shared substrate"
type = "layers"
containers = ["graph_works_core"]
layers = [
    "ingest : scan : query : lint_drift : archive : orchestrate : wiki_stats : work : util",
    "agent_substrate : graph : prompts",
    "workspace",
]

[[tool.importlinter.contracts]]
name = "graph_works_core verticals never import each other"
type = "independence"
modules = [
    "graph_works_core.ingest",
    "graph_works_core.scan",
    "graph_works_core.query",
    "graph_works_core.lint_drift",
    "graph_works_core.archive",
    "graph_works_core.orchestrate",
    "graph_works_core.wiki_stats",
    "graph_works_core.work",
    "graph_works_core.util",
]
