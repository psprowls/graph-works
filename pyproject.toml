[project]
name = "agent-workspace"
version = "0.0.0"
description = "uv workspace root for the okf-io packages. Not distributable."
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
okf-io = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "okf-io",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Fixtures are a byte-exact corpus; `scripts/` is repo tooling that predates
# this workspace and is not part of any package.
extend-exclude = [
    "packages/okf-io/tests/fixtures",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]

[tool.ruff.lint.per-file-ignores]
"packages/okf-io/tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/okf-io/tests"]
pythonpath = ["packages/okf-io/tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["okf_io"]
